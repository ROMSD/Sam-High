<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sam High</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <h1>Samuel High School</h1>
                <p>Login</p>
            </div>


            <div class="auth-header">

                <h2>Welcome Back</h2>

                <p>
                    Login to access your dashboard
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                    <button type="button"  id="togglepassword">show</button>
                    <p id="capswarning" style="display: none; color: orange;">Caps lock is on!</p>

                </div>


                <p id="loginMessage" class="message"></p>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="create-account.html">
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
