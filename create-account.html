<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ResultSys</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <h1>Samuel High School</h1>
                <p>Create Account</p>
            </div>


            <div class="auth-header">

                <h2>Create Account</h2>

                <p>
                    Create an administrator account
                </p>

            </div>


            <form id="createAccountForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                    

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >
                    <button type="button"  id="togglepassword">show</button>
                </div>


                <p
                    id="accountMessage"
                    class="message"
                ></p>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>


    <script src="js/create-account.js"></script>

</body>

</html>
